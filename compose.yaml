# TR-STR-006: one committed manifest brings up both images, and a database
# service where the active profile requires one (§8.4).
#
#   docker compose up --build                      → local preview, SQLite, no db service
#   docker compose --profile postgres up --build   → deployed shape, PostgreSQL
#
# The backend image is identical either way. Only configuration changes
# (TR-DB-003).

name: sddfreak

services:
  backend:
    build: ./backend
    environment:
      APP_PROFILE: ${APP_PROFILE:-local-preview}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      SQLITE_FILE: /app/data/sddfreak.db
      DATABASE_URL: ${DATABASE_URL:-postgres://sddfreak:sddfreak@db:5432/sddfreak}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - backend-data:/app/data
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:3000
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy

  # Only started under the postgres profile; the local preview needs no
  # external database service at all (TR-DB-001).
  db:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: sddfreak
      POSTGRES_PASSWORD: sddfreak
      POSTGRES_DB: sddfreak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sddfreak']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend-data:
  postgres-data:
