# TR-STR-006: one committed manifest brings up both images. There is no
# database service to bring up — SQLite is a file the backend opens itself
# (TR-DB-001, CON-004).
#
#   docker compose up --build                        → local preview
#   APP_PROFILE=deployed SESSION_SECRET=… docker compose up --build
#
# The backend image is identical either way. Only configuration changes
# (TR-DB-014).

name: sddfreak

services:
  backend:
    build: ./backend
    environment:
      APP_PROFILE: ${APP_PROFILE:-local-preview}
      SQLITE_FILE: ${SQLITE_FILE:-/app/data/sddfreak.db}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - backend-data:/app/data
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:3000
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # The system of record. Named rather than bind-mounted so `compose down`
  # keeps it and `compose down -v` is the deliberate way to discard it.
  backend-data:
