name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TR-STR-002: each tree builds, lints, and tests on its own.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # TR-DB-006: the full suite, on the one engine there is.
      - run: npm test

      # NFR-SEC-009
      - run: npm audit --audit-level=high

      # TR-BE-005: the published description must match the implementation.
      - run: npm run openapi
      - name: OpenAPI description is up to date
        run: git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

      # TR-STR-004: the generated API types must regenerate without manual edit.
      - run: npm run gen:api
      - name: Generated API types are up to date
        run: git diff --exit-code src/api/schema.d.ts
